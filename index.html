<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4b66">
<title>ITN Mass Campaign</title>
<link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0b4b66; --orange:#c84c0e; --orange-d:#a83f0b; --orange-bg:#fbede6;
    --grey:#eeeeee; --ink:#0b0c0c; --text:#363636; --muted:#787878; --line:#d6d5d4;
    --white:#fff; --info:#0057bd; --info-bg:#e3eefb;
    --sh-sm:0 1px 2px rgba(0,0,0,.16); --sh-lg:0 12px 36px rgba(0,0,0,.28);
    --disp:'Roboto Condensed','Roboto',system-ui,sans-serif; --body:'Roboto',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--body);color:var(--text);background:#d9dde0;display:flex;align-items:center;justify-content:center;
    padding:clamp(0px,2vmin,22px);min-height:100vh;min-height:100dvh;}
  .phone{width:min(100%,clamp(360px,44vh,470px));height:96vh;height:96dvh;max-height:940px;background:#111;
    border-radius:clamp(28px,4vh,46px);padding:clamp(6px,1vh,12px);box-shadow:var(--sh-lg);}
  .screen{position:relative;width:100%;height:100%;background:var(--grey);border-radius:clamp(20px,3vh,36px);overflow:hidden;
    display:flex;flex-direction:column;}
  @media (max-width:700px),(max-height:620px){
    body{padding:0;}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;}
    .screen{border-radius:0;}
  }
  @media (min-width:1100px) and (min-height:1000px){ .phone{width:min(100%,520px);} }

  /* top bar */
  .appbar{flex:0 0 auto;background:var(--teal);color:#fff;min-height:64px;padding:12px 56px 12px 18px;display:flex;align-items:center;}
  @supports (padding-top: env(safe-area-inset-top)){ .appbar{padding-top:calc(12px + env(safe-area-inset-top));} }
  .eyebrow{font:400 11.5px/1.2 var(--body);color:rgba(255,255,255,.72);}
  .title{font:500 19px/1.2 var(--body);margin-top:2px;}
  .uat{position:absolute;top:0;right:0;width:84px;height:84px;overflow:hidden;pointer-events:none;z-index:5;}
  .uat span{position:absolute;top:17px;right:-30px;width:120px;transform:rotate(45deg);background:#4caf50;color:#fff;
    font:700 11px/1 var(--body);letter-spacing:.06em;text-align:center;padding:5px 0;box-shadow:0 1px 3px rgba(0,0,0,.3);}

  .ico-btn{width:42px;height:42px;border:none;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;
    cursor:pointer;flex:0 0 auto;margin:0 6px 0 -10px;}
  .ico-btn:active{background:rgba(255,255,255,.14);}
  /* role cards on the home page: white card, orange icon, teal name, arrow */
  .rc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-family:var(--body);background:var(--white);border:none;
    border-radius:12px;padding:14px 12px 14px 14px;margin-bottom:12px;cursor:pointer;box-shadow:var(--sh-sm);}
  .rc:active{box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .rc .ic{width:52px;height:52px;border-radius:12px;background:var(--orange-bg);color:var(--orange);display:grid;place-items:center;flex:0 0 auto;}
  .rc .ic svg{width:30px;height:30px;}
  .rc .t{flex:1;min-width:0;}
  .rc h3{font:500 17px/1.2 var(--body);color:var(--teal);margin-bottom:4px;}
  .rc p{font:400 13px/1.4 var(--body);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .rc .ar{color:var(--teal);flex:0 0 auto;}
  .sub{font:400 13.5px/1.5 var(--body);color:var(--muted);margin:-6px 0 16px;}
  .body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .list{padding:20px 14px 28px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font:400 12.5px/1 var(--body);color:var(--info);background:var(--info-bg);
    border-radius:4px;padding:7px 10px;}
  h1{font:700 30px/1.12 var(--disp);color:var(--teal);margin:12px 0 14px;}
  .card{background:var(--white);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--sh-sm);}
  .role{display:flex;gap:14px;align-items:flex-start;}
  .role .ic{width:56px;height:56px;border-radius:14px;background:var(--orange-bg);color:var(--orange);display:grid;place-items:center;flex:0 0 auto;}
  .role .ic svg{width:32px;height:32px;}
  .role h2{font:500 17px/1.25 var(--body);color:var(--teal);margin-bottom:5px;}
  .role p{font:400 14px/1.5 var(--body);color:var(--text);}
  .empty{text-align:center;padding:30px 16px;}
  .empty .ei{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:var(--grey);color:#9e9e9e;display:grid;place-items:center;}
  .empty h3{font:500 15px var(--body);color:var(--teal);margin-bottom:4px;}
  .empty p{font:400 13px/1.45 var(--body);color:var(--muted);}
  .ver{text-align:center;font:400 11px/1.4 var(--body);color:var(--muted);margin-top:14px;}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="appbar" id="bar"></div>
  <div class="uat"><span>UAT</span></div>
  <div class="body" id="body"></div>
</div></div>

<script>
/* One tab per campaign role. Add a role here and it gets a tab, an icon and a page.
   The descriptions are short working summaries, to be confirmed by the programme. */
const ICON={
  truck:'<path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>',
  warehouse:'<path d="M22 21V7L12 3 2 7v14h5v-9h10v9h5zm-11-2H9v2h2v-2zm2-3h-2v2h2v-2zm2 3h-2v2h2v-2z"/>',
  hhr:'<path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/>',
  box:'<path d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4l16-.02V7z"/>',
  health:'<path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>',
  team:'<path d="M16.5 12c1.38 0 2.49-1.12 2.49-2.5S17.88 7 16.5 7C15.12 7 14 8.12 14 9.5s1.12 2.5 2.5 2.5zM9 11c1.66 0 2.99-1.34 2.99-3S10.66 5 9 5C7.34 5 6 6.34 6 8s1.34 3 3 3zm7.5 3c-1.83 0-5.5.92-5.5 2.75V19h11v-2.25c0-1.83-3.67-2.75-5.5-2.75zM9 13c-2.33 0-7 1.17-7 3.5V19h7v-2.25c0-.85.33-2.34 2.37-3.47C10.5 13.1 9.66 13 9 13z"/>',
  laptop:'<path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>',
  shield:'<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>',
  forms:'<path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>'
};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICON[k]}</svg>`;
const ROLES=[
  {id:'conveyor',  name:'Conveyor',             icon:'truck',
   about:'Moves ITN bales from the district warehouse to the health facilities and distribution points, and confirms each delivery against its waybill.'},
  {id:'warehouse', name:'Warehouse Manager',    icon:'warehouse',
   about:'Receives, stores and dispatches ITN bales, and keeps the stock records and waybills for every movement in and out of the warehouse.'},
  {id:'hhr',       name:'HHR',                  icon:'hhr',
   about:'Household Registrar. Visits each household, registers it, issues the e-token and gives the key messages on net use.'},
  {id:'distributor',name:'Distributor',         icon:'box',
   about:'Issues ITNs at the distribution point to households that bring their e-token, and records each net given out.'},
  {id:'dhmt',      name:'DHMT',                 icon:'health',
   about:'District Health Management Team. Oversees the campaign in the district: planning, stock, coverage and follow up of problems.'},
  {id:'supervisor',name:'Chiefdom Supervisor',  icon:'team',
   about:'Supervises the registrars and distributors in the chiefdom, checks their work in the field and reports issues to the district.'},
  {id:'ict4d',     name:'ICT4D Consultants',    icon:'laptop',
   about:'Sets up and supports the phones and apps, helps users sign in and sync their data, and fixes technical problems in the field.'},
  {id:'monitor',   name:'National Monitor',     icon:'shield',
   about:'Independent monitoring across districts: checks the quality of registration and distribution and reports findings nationally.'}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const BACK='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>';
const ARROW='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 17l5-5-5-5v10z"/></svg>';
const VER='<div class="ver">Version 1.0 · Powered by DIGIT HCM &amp; ICF-SL</div>';
const bar=document.getElementById('bar'), body=document.getElementById('body');

/* home: one card per role */
function home(){
  bar.innerHTML=`<div><div class="eyebrow">Sierra Leone</div><div class="title">ITN Mass Campaign</div></div>`;
  body.innerHTML=`<div class="list">
    <h1>Choose your role</h1>
    <p class="sub">Tap your role to open its forms.</p>
    ${ROLES.map(r=>`<button class="rc" onclick="go('${r.id}')">
        <span class="ic">${svg(r.icon)}</span>
        <span class="t"><h3>${esc(r.name)}</h3><p>${esc(r.about)}</p></span>
        <span class="ar">${ARROW}</span></button>`).join('')}
    ${VER}</div>`;
  body.scrollTop=0;
}
/* one role */
function role(r){
  bar.innerHTML=`<button class="ico-btn" onclick="go('')" aria-label="Back to roles">${BACK}</button>
    <div><div class="eyebrow">ITN Mass Campaign</div><div class="title">${esc(r.name)}</div></div>`;
  body.innerHTML=`<div class="list">
    <h1>${esc(r.name)}</h1>
    <div class="card role"><div class="ic">${svg(r.icon)}</div>
      <div><h2>About this role</h2><p>${esc(r.about)}</p></div></div>
    <div class="card empty"><div class="ei">${svg('forms').replace('<svg','<svg width="26" height="26"')}</div>
      <h3>No forms yet</h3><p>The ${esc(r.name)} forms will appear here.</p></div>
    ${VER}</div>`;
  body.scrollTop=0;
}
/* the address keeps the page, so the phone's back button and links work: #hhr, #dhmt … */
function go(id){ location.hash=id?'#'+id:''; if(!id) route(); }
function route(){ const r=ROLES.find(x=>x.id===location.hash.slice(1)); r?role(r):home(); }
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
